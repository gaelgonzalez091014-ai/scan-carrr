
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCAN CAR - Vehículo</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<nav>
    <h2> SCAN CAR</h2>
    <a href="index.html">Inicio</a>
    <a href="vehiculo.html">Vehículo</a>
    <a href="diagnostico.html">Diagnóstico</a>
    <a href="resultado.html">Resultados</a>
</nav>

<main class="contenedor">
    <h1>Información del vehículo</h1>

    <div class="tarjeta">
        <label>Marca del automóvil</label>
        <select id="marca">
            <option value="">Selecciona una marca</option>
            <option>Nissan</option>
            <option>Toyota</option>
            <option>Chevrolet</option>
            <option>Ford</option>
            <option>Volkswagen</option>
            <option>Honda</option>
            <option>Mazda</option>
            <option>Kia</option>
            <option>Hyundai</option>
            <option>BMW</option>
            <option>Audi</option>
            <option>Mercedes-Benz</option>
        </select>

        <label>Modelo</label>
        <select id="modelo" disabled>
            <option value="">Primero selecciona una marca</option>
        </select>

        <label>Año</label>
        <select id="anio" disabled>
            <option value="">Primero selecciona un modelo</option>
        </select>

        <label>Tipo de motor</label>
        <select id="motor">
            <option>Gasolina</option>
            <option>Diésel</option>
            <option>Híbrido</option>
            <option>Eléctrico</option>
        </select>

        <button onclick="guardarVehiculo()">
            Guardar y continuar
        </button>

        <p id="mensaje"></p>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
